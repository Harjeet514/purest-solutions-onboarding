<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Face Scan — Purest Solutions</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="phone">
    <div class="scan-screen">

      <div class="status-bar dark-text">
        <span>9:41</span>
        <span>••• 📶 🔋</span>
      </div>

      <div class="page-header">
        <button class="back-btn light" aria-label="Go back" onclick="window.location.href='selfie-instructions.html'">&#8592;</button>
        <h1 class="page-title" id="scanTitle">Click your photo</h1>
      </div>

      <!-- Camera viewport. In a real app this would show the live
           camera feed (e.g. via getUserMedia + <video>). We use a
           placeholder background here — swap for the real feed. -->
      <div class="camera-view">
        <div class="face-oval" id="faceOval">
          <!-- Face mesh overlay, only shown during "analyzing" state -->
          <svg class="face-mesh" id="faceMesh" viewBox="0 0 200 260" aria-hidden="true">
            <g stroke="rgba(255,255,255,0.6)" stroke-width="1" fill="none">
              <path d="M100 30 L60 90 L70 160 L100 200 L130 160 L140 90 Z" />
              <line x1="60" y1="90" x2="140" y2="90" />
              <line x1="70" y1="130" x2="130" y2="130" />
              <line x1="100" y1="30" x2="100" y2="200" />
              <circle cx="80" cy="110" r="4" />
              <circle cx="120" cy="110" r="4" />
              <path d="M85 160 Q100 170 115 160" />
            </g>
          </svg>
        </div>
      </div>

      <!-- State 1: positioning guide with live status checks -->
      <div class="scan-status-row" id="statusRow">
        <div class="status-chip good" id="chipLight">
          <span class="status-icon">✓</span>
          <span>Light</span>
        </div>
        <div class="status-chip bad" id="chipDistance">
          <span class="status-icon">✕</span>
          <span>Close to Camera</span>
        </div>
        <div class="status-chip good" id="chipOval">
          <span class="status-icon">✓</span>
          <span>In Oval</span>
        </div>
      </div>

      <!-- State 2: review the captured photo -->
      <div class="scan-actions" id="reviewActions" hidden>
        <button class="secondary-btn" id="retakeBtn" type="button">Retake</button>
        <button class="primary-btn narrow" id="continueBtn" type="button">Continue</button>
      </div>

      <!-- State 3: analyzing progress -->
      <div class="analyzing-panel" id="analyzingPanel" hidden>
        <div class="progress-track">
          <div class="progress-fill" id="progressFill"></div>
        </div>
        <p class="progress-label">Analyzing your face</p>
        <button class="cancel-link" id="cancelBtn" type="button">Cancel</button>
      </div>

      <!-- Tap-to-capture hint for state 1 (screenshot has no visible
           shutter button, so tapping the camera view itself captures —
           common pattern for face-scan flows) -->
      <button class="capture-hint" id="captureHint" type="button">
        Tap the frame to capture
      </button>

    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
