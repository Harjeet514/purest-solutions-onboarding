<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Instructions for Selfie — Purest Solutions</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <div class="phone">
    <div class="screen">

      <div class="status-bar dark-text">
        <span>9:41</span>
        <span>••• 📶 🔋</span>
      </div>

      <div class="page-header">
        <button class="back-btn light" aria-label="Go back" onclick="window.location.href='skin-profile.html'">&#8592;</button>
        <h1 class="page-title">Instructions to follow before selfie</h1>
      </div>

      <div class="instructions-grid">
        <div class="instruction-item">
          <div class="instruction-icon" aria-hidden="true">💡</div>
          <p class="instruction-text">Present light should be on your face</p>
        </div>
        <div class="instruction-item">
          <div class="instruction-icon" aria-hidden="true">🎯</div>
          <p class="instruction-text">Ensure your face is neatly pulled back</p>
        </div>
        <div class="instruction-item">
          <div class="instruction-icon" aria-hidden="true">🚫</div>
          <p class="instruction-text">Remove makeup before scanning</p>
        </div>
        <div class="instruction-item">
          <div class="instruction-icon" aria-hidden="true">📷</div>
          <p class="instruction-text">Keep your face still while taking the selfie</p>
        </div>
      </div>

      <div class="instructions-footer">
        <button class="primary-btn" id="takeSelfieBtn" type="button">Take a selfie</button>
      </div>

    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
